<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0b33"/><stop offset="0.65" stop-color="#090616"/><stop offset="1" stop-color="#03040a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3df2" stop-opacity="0"/><stop offset="0.55" stop-color="#ff3df2" stop-opacity="0.55"/><stop offset="1" stop-color="#ff3df2" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <!-- the agent's beam -->
    <rect x="548" y="100" width="56" height="400" fill="url(#beam)" filter="url(#glow)"/>
    <!-- skyline -->
    <g fill="#0d0b1e" stroke="#3be8ff" stroke-width="7" filter="url(#glow)">
      <rect x="150" y="560" width="110" height="420"/>
      <rect x="282" y="440" width="140" height="540"/>
      <rect x="444" y="620" width="84" height="360"/>
      <rect x="520" y="500" width="112" height="480" stroke="#ff3df2"/>
      <rect x="656" y="380" width="128" height="600"/>
      <rect x="806" y="590" width="90" height="390"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffd27a" opacity="0.9">
      <rect x="306" y="480" width="22" height="14"/><rect x="346" y="480" width="22" height="14"/><rect x="306" y="530" width="22" height="14"/><rect x="386" y="580" width="22" height="14"/>
      <rect x="682" y="420" width="22" height="14"/><rect x="722" y="470" width="22" height="14"/><rect x="682" y="570" width="22" height="14"/><rect x="742" y="620" width="22" height="14"/>
      <rect x="176" y="600" width="22" height="14"/><rect x="212" y="660" width="22" height="14"/>
    </g>
    <!-- the agent's sign on its roof -->
    <rect x="512" y="452" width="128" height="34" rx="8" fill="#05060d" stroke="#ff3df2" stroke-width="6" filter="url(#glow)"/>
    <rect x="534" y="465" width="84" height="8" rx="4" fill="#ff3df2"/>
    <!-- wet street -->
    <rect x="100" y="860" width="824" height="70" fill="#03040a"/>
    <rect x="160" y="890" width="300" height="5" fill="#3be8ff" opacity="0.5"/><rect x="540" y="905" width="260" height="5" fill="#ff3df2" opacity="0.45"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="none" stroke="#3be8ff" stroke-opacity="0.35" stroke-width="4"/>
</svg>
